<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Store - Registro</title>
  <link rel="stylesheet" href="./login.css"> 
</head>
<body>
  <div class="container">
    <form id="registroForm">
      <header>
        <h1>🍕 Food Store</h1>
        <h2>Crear Cuenta</h2>
      </header>
      <div class="form-group">
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
      </div>
      <div class="form-group">
          <label for="apellido">Apellido:</label>
          <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" required>
      </div>
      <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" placeholder="juan@mail.com" required>
      </div>
      <div class="form-group">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" minlength="6" placeholder="Mínimo 6 caracteres" required>
      </div>
      <button type="submit" class="btn-ingresar">REGISTRARSE</button>
    </form>
    <div class="footer-links">
        ¿Ya tenés cuenta? <a href="/src/pages/auth/login/login.html">Iniciá sesión acá</a>
    </div>
  </div> 
  <script type="module" src="./registro.ts"></script>
</body>
</html>
