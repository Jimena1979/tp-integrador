<!DOCTYPE html>
<html lang="es"> <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Store - Login</title>
  <link rel="stylesheet" href="./login.css">
</head>

<body>
  <div class="container">
    <form id="form">
      <header>
        <h1>🍕 Food Store</h1>
        <h2>Iniciar Sesión</h2>
      </header>
      
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Ej: juan@mail.com" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required>
      </div>
          
      <button type="submit" class="btn-ingresar">INGRESAR</button>
    </form>

    <div class="footer-links">
      ¿No tenés cuenta? <a href="/src/pages/auth/registro/registro.html">Registrate acá</a>
    </div>
  </div>

  <script type="module" src="./login.ts"></script>
</body>
</html>
